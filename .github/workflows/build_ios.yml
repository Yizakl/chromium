name: Build Chromium iOS (Device)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-device:
    runs-on: macos-latest
    env:
      DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools
      CHROMIUM_SRC: ${{ github.workspace }}/chromium

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          brew install python@3.11 ninja git cmake
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $DEPOT_TOOLS_PATH
          echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH

      - name: Fetch Chromium for iOS
        run: |
          mkdir -p $CHROMIUM_SRC
          cd $CHROMIUM_SRC
          fetch --nohooks ios
          gclient sync --with_branch_heads

      - name: Configure build for iOS Device
        run: |
          cd $CHROMIUM_SRC
          # arm64 真机构建，关闭签名
          gn gen out/ios_device --args='target_os="ios" target_cpu="arm64" is_debug=true enable_ios_signing=false'

      - name: Build Chromium for iOS Device
        run: |
          cd $CHROMIUM_SRC
          autoninja -C out/ios_device chrome_ios

      - name: Package .app into .ipa (Unsigned)
        run: |
          APP_PATH="$CHROMIUM_SRC/out/ios_device/Chrome.app"
          IPA_PATH="$CHROMIUM_SRC/out/ios_device/Chrome.ipa"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$IPA_PATH" Payload
          rm -rf Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: chromium-ios-device
          path: ${{ github.workspace }}/chromium/out/ios_device/Chrome.ipa
